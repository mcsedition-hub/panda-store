name: Proposer un module
description: Un besoin métier ou une intégration
body:
  - type: textarea
    id: need
    attributes:
      label: Quel besoin voulez-vous résoudre ?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Parcours proposé
      description: Entrée, actions et résultat attendu.
  - type: textarea
    id: dependencies
    attributes:
      label: Données, services et permissions nécessaires
