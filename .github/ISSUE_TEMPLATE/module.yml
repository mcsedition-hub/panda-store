name: Propose a module
description: A business need or integration
body:
  - type: textarea
    id: need
    attributes:
      label: What need would this address?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Proposed workflow
      description: Inputs, actions and expected result.
  - type: textarea
    id: dependencies
    attributes:
      label: Required data, services and permissions
