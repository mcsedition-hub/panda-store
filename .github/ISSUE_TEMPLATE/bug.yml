name: Report a bug
description: A reproducible problem in Panda Store
body:
  - type: markdown
    attributes:
      value: Do not post secrets or exploitable vulnerability details here. See SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: commit, OS, browser, SQLite or Compose
