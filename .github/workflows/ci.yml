name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: panda_test
          POSTGRES_USER: panda
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U panda -d panda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: panda_store.settings_test
      TEST_DATABASE_URL: postgresql://panda:ci-only-password@localhost:5432/panda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run build
        working-directory: web
