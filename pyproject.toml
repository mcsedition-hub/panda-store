[project]
name = "panda-store"
version = "0.1.0a1"
description = "A modular, self-hostable workspace for mobile app growth."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "Django>=5.2.18,<5.3",
  "djangorestframework>=3.16,<4",
  "celery[redis]>=5.6,<6",
  "dj-database-url>=2.3,<4",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "gunicorn>=23,<24",
  "uvicorn>=0.35,<1",
  "packaging>=24,<27",
  "PyJWT[crypto]>=2.15.1,<3",
  "cryptography>=50.0.2,<51",
  "httpx>=0.28.1,<0.29",
  "Pillow>=12,<14",
  "playwright>=1.55,<2",
  "httpcore>=1.0.9,<1.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5", "ruff>=0.11,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5", "ruff>=0.11,<1", "pip-tools>=7.4,<8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["panda_store*", "addons*"]

[tool.setuptools.package-data]
"*" = ["module.json", "fixtures/*.json", "knowledge/*.json", "evaluation/*.json", "fonts/*.woff2", "fonts/*.txt", "browser_extension/*.js", "browser_extension/*.json", "browser_extension/*.md"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "panda_store.settings_test"
pythonpath = ["."]
testpaths = ["tests", "addons"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
